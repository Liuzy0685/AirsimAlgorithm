# Trajectory flight configuration — real MissionEnd closed-loop flights.
#
# Overrides minimal_flight.yaml's 2 m geofence / 10 s duration, both of which
# would abort a ~42.6 m flight to the real MissionEnd actor near spawn.
#
# Notes (Phase C1-R):
#   * geofence_radius_m is a hard safety bound: 42.6 m goal + column-avoidance
#     lateral offset must stay inside it.  50 m is the current validation cap.
#   * max_flight_duration_s is a FINITE mission timeout for ALL goal sources
#     (actor and config_fixed).  600 s gives room for slow, cautious terminal
#     approach plus avoidance margin.  mission_complete → success;
#     time_limit → failure.
#
# Use with:
#   python scripts/flight_mode.py --local-navigation-mode trajectory \
#       --flight-config configs/trajectory_flight.yaml \
#       --trajectory-config configs/trajectory_planner.yaml ...

minimal_flight:
  target_z_ned: -1.0
  max_vertical_speed_mps: 0.5
  takeoff_timeout_s: 20.0
  max_flight_duration_s: 600.0     # finite timeout for ALL missions (incl. actor)
  command_duration_s: 0.2
  forward_speed_mps: 0.15          # 降速给避障更多反应时间
  side_speed_mps: 0.20
  front_threshold_m: 2.5
  emergency_distance_m: 0.8
  geofence_radius_m: 50.0          # ≥42.6 m goal + avoidance margin
  preflight_lidar_frames: 3
  landing_confirmation_frames: 3
