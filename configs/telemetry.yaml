# C telemetry gateway configuration.  Both endpoints intentionally bind to
# loopback until authentication is added to the multi-process protocol.
upstream_url: ws://127.0.0.1:8765/ws/swarm
frontend_host: 127.0.0.1
frontend_port: 8000
telemetry_path: /ws/telemetry
reconnect_delays_s: [0.5, 1.0, 2.0, 5.0]
frontend_offline_after_s: 3.0
expected_producer: a-state-service
