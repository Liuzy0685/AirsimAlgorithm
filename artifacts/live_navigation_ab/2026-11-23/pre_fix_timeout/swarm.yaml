drones:
- vehicle_name: Drone1
  lidar_name: LidarSensor1
  goal_x: 15.0
  goal_y: 0.0
  target_z: -2.0
  local_navigation_mode: trajectory
  perception_config: configs/acceptance/perception.yaml
  flight_config: configs/acceptance/flight.yaml
- vehicle_name: Drone2
  lidar_name: LidarSensor2
  goal_x: 15.0
  goal_y: 0.0
  target_z: -2.0
  local_navigation_mode: trajectory
  perception_config: configs/acceptance/perception.yaml
  flight_config: configs/acceptance/flight.yaml
coordination:
  enabled: true
  yield_enabled: true
  algorithm: orca
  passing_bias_mps: 0.1
  prediction_horizon_s: 3.0
  safety_distance_m: 2.0
  peer_poll_interval_s: 0.2
  diagnostic_log_interval_s: 0.2
  max_state_timestamp_skew_s: 0.5
  yield_release_margin_m: 0.75
  yield_release_delay_s: 0.5
state_service:
  enabled: true
  host: 127.0.0.1
  port: 8765
  leader: Drone1
  task_id: swarm-mission
  snapshot_max_age_s: 0.6
  heartbeat_s: 1.0
  disconnect_timeout_s: 2.0
  startup_timeout_s: 15.0
  lease_ttl_s: 2.0
  lifecycle_lease_s: 90.0
  allow_legacy_readiness: true
navigation:
  enabled: true
  adaptive_slots: true
  maintain_heading: true
  clearance_m: 1.1
  resolution_m: 0.25
  waypoint_distance_m: 2.0
  max_range_m: 40.0
  leader_wait_error_m: 5.0
  leader_resume_error_m: 2.0
  feedback_max_age_s: 1.5
local_navigation_hardening:
  enabled: true
  memory: true
  recovery: true
  smoothing: true
  passage: true
  diagnostics: true
  free_confirmations: 3
  max_memory_cells: 8000
  clearing_rays: 48
  stall_window_s: 6.0
  stall_displacement_m: 0.2
  stall_progress_m: 0.15
  failure_ttl_s: 30.0
  acceleration_mps2: 0.35
  braking_mps2: 0.35
  passage_wait_s: 8.0
